<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход и Регистрация - Ламповый Форум 2006</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="forum-body" class="theme-classic">

    <div class="nav-links">
        <a href="/">Главная страница форума</a> &raquo; Авторизация
    </div>

    <h2>Добро пожаловать на форум!</h2>

    <!-- Вывод ошибок, если пользователь ввел что-то не то -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: #FFF0F0; border: 1px solid #FF0000; padding: 10px; margin-bottom: 15px; color: #FF0000; font-weight: bold;">
          {% for message in messages %}{{ message }}{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <table class="forum-table" style="width: 100%; border-spacing: 10px; background: none; border: none;">
        <tr>
            <!-- ЛЕВАЯ КЛОНКА: ВХОД -->
            <td class="row1" style="width: 50%; border: 1px solid #105289; vertical-align: top; padding: 20px;">
                <h3 style="margin-top:0; color:#105289;">Вход на форум</h3>
                <form action="/login" method="POST">
                    <label>Имя пользователя:</label><br>
                    <input type="text" name="username" style="width:90%; margin-bottom:10px;" required><br>
                    
                    <label>Пароль:</label><br>
                    <input type="password" name="password" style="width:90%; margin-bottom:15px;" required><br>
                    
                    <input type="submit" value="Войти">
                </form>
            </td>

            <!-- ПРАВАЯ КОЛОНКА: РЕГИСТРАЦИЯ -->
            <td class="row2" style="width: 50%; border: 1px solid #105289; vertical-align: top; padding: 20px;">
                <h3 style="margin-top:0; color:#105289;">Регистрация нового аккаунта</h3>
                <form action="/register" method="POST">
                    <label>Желаемое имя (Никнейм):</label><br>
                    <input type="text" name="username" style="width:90%; margin-bottom:10px;" required><br>
                    
                    <label>Email-адрес:</label><br>
                    <input type="email" name="email" style="width:90%; margin-bottom:10px;" required><br>
                    
                    <label>Пароль:</label><br>
                    <input type="password" name="password" style="width:90%; margin-bottom:15px;" required><br>
                    
                    <input type="submit" value="Зарегистрироваться">
                </form>
            </td>
        </tr>
    </table>

    <script>
        const savedTheme = localStorage.getItem('user-theme');
        if (savedTheme) { document.getElementById('forum-body').className = savedTheme; }
    </script>
</body>
</html>
